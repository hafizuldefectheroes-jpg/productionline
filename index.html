:root[data-theme="dark"] {

.seg button { display: inline-flex; align-items: center; gap: 4px; min-height: 26px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); }

.seg.left { margin-right: auto; }
.hint { z-index: 2; position: absolute; left: 8px; bottom: 8px; padding: 4px 8px; border-radius: 7px; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); color: var(--muted); font-size: 12px; pointer-events: none; }
.legend { z-index: 2; position: absolute; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: 540px; justify-content: flex-end; padding: 5px 9px; border-radius: 7px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); color: var(--muted); font-size: 12px; pointer-events: none; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 16px; height: 5px; border-radius: 3px; display: inline-block; }
.legend[hidden] { display: none; }
.pin { pointer-events: auto; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 2px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); box-shadow: 0 2px 8px var(--shadow); cursor: pointer; white-space: nowrap; }
.pin .badge { min-width: 20px; height: 18px; border-radius: 9px; font-size: 9.5px; padding: 0 3px; }
.pin .pn { display: none; font-size: 12.5px; font-weight: 600; padding-right: 7px; }
.pin:hover, .pin.on { z-index: 5; }
.pin:hover .pn, .pin.on .pn { display: inline; }

.render .brand, .render .side, .render .toolbar, .render .hint, .render .legend, .render .labels { display: none !important; }

.render .stage { border-radius: 0; border: 0; }
@media (max-width: 860px) {

ne and goes to the RDF bunker."}, {"id": "e11", "n": "11", "group": "Fines line · <50 mm", "name": "Eddy current separator RD-1500", "sub": "6.0 × 2.3 m", "at": [29.8, 35.8, 3.6], "dist": 18, "facts": ["10.2 kW (XRIDO)", "fed by K11"], "desc": "Near the front wall as drawn by XRIDO. K11 drops the 12–50 mm fraction onto its feeder at the west end. Glass and inert, the main stream, leave on K2 (800 × 5000, 2.2 kW) east into the glass & inert bay; non-ferrous metal leaves on K3 (600 × 5000, 1.1 kW) north into its skip. There is no magnet ahead of it on the drawing; ask XRIDO to add one, because steel on the rotor shell damages it."}, {"id": "ib", "n": "IB", "group": "Fines line · <50 mm", "name": "Glass & inert bay", "at": [37.3, 36.6, 3.2], "dist": 18, "facts": ["under the K2 head", "open to the north"], "desc": "Walled bay at the front wall where K2 drops glass and inert. The bobcat takes it east along the front cross aisle to glass partition SG."}, {"id": "aisle", "n": "A", "group": "Lanes · bobcat, bins, people", "name": "Back aisle · west part only", "at": [40.0, 6.35, 2.5], "dist": 30, "facts": ["ends at FA", "Fe skip access"], "desc": "The back aisle now stops at FA, which starts low at the air separator. It still serves the Fe skip under the magnet and links to the platform-1 lane."}, {"id": "binlane", "n": "BL", "group": "Lanes · bobcat, bins, people", "name": "Bin lane · platform 2 east side", "at": [60.7, 20.0, 2.5], "dist": 22, "facts": ["people + roller bins only", "no vehicles"], "desc": "The old platform-2 lane is now for people and roller bins only. Bins from platform 2's east side come out straight into it, and bins from the other sides arrive via the front cross aisle. Workers tip each bin into the matching temporary bay on the east side of the lane."}, {"id": "bclane", "n": "BK", "group": "Lanes · bobcat, bins, people", "name": "Bobcat lane & front cross aisle", "at": [68.5, 20.0, 2.5], "dist": 26, "facts": ["one bobcat", "shared with forklift FL1 at de and 12.4 m deep, with wheel stops at the back. Offtaker tippers reverse in and leave forwards. Forklift FL2 loads bales over the side from the 3.8 m strip between the bays; bulk compost and glass go in by bobcat."}, {"id": "g3", "n": "G3", "group": "Loading bay · Gate 3", "name": "Gate 3 · loading bay", "sub": "12 m", "at": [96.0, 40.0, 3.5], "dist": 26, "facts": ["tipper bays A and B", "forklift strip"], "desc": "Opens straight onto the two tipper bays and the forklift strip between them. A barrier on the west side keeps the bays apart from the front cross aisle."}, {"id": "g2", "n": "G2", "group": "People & services", "name": "Gate 2 · staff, visitors and product access", "sub": "18 m", "at": [51.0, 40.0, 3.5], "dist": 26, "facts": ["no gatehouse or room", "zebra to the platforms"], "desc": "An open entrance with no turnstile, post or room. Staff and visitors walk straight in over the zebra to the gap between the platforms, or west along the front wall to the control room. The same opening gives vehicle access to the front cross aisle that links the machine bays to the storage."}, {"id": "cr", "n": "CR", "group": "People & services", "name": "Control room · 2 control panels", "sub": "4.2 × 3.4 m", "at": [22.1, 32.1, 3.5], "dist": 18, "facts": ["2 panels side by side", "1.2 m working space", "room for 2 people"], "desc": "Replaces the MCC switch room and the people hub. Two control panels stand on the north wall with 1.2 m clear in front, enough for two people to check, maintain and switch the line on and off. It sits where the old switch room was, so the genset cable route is unchanged, and staff reach it along the front wall from Gate 2. Panel size is assumed at 1.2 × 0.6 × 2.1 m until XRIDO confirms its two cabinets."}, {"id": "genset", "n": "GS", "group": "People & services", "name": "Temporary diesel genset 500 kW", "at": [-2.7, 14.0, 4.6], "dist": 20, "facts": ["NW end", "only supply until the substation"], "desc": "A 500 kW / 625 kVA prime-rated genset in
